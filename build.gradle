plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
// All mod Java sources currently live in src/main/java; use one source set so Minecraft client APIs are available during compilation.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.jthink:jaudiotagger:${jaudiotagger_version}"
    implementation "ws.schild:jave-core:${jave_version}"
    runtimeOnly "ws.schild:jave-nativebin-win64:${jave_version}"
    runtimeOnly "ws.schild:jave-nativebin-linux64:${jave_version}"
    runtimeOnly "ws.schild:jave-nativebin-osx64:${jave_version}"
    runtimeOnly "ws.schild:jave-nativebin-osxm1:${jave_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
